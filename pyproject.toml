[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mekiki"
version = "0.1.0"
description = "Detects Japanese scam and phishing emails and explains the evidence behind the verdict."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mekiki = ["resources/*.json", "resources/*.txt"]

[tool.pytest.ini_options]
# Lets `pytest` find the package under src/ without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
